<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Fines - Library Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <i class="fas fa-book-open"></i> Library
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="admin-dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a href="manage-books.html" class="nav-link"><i class="fas fa-book"></i> Manage Books</a>
                </li>
                <li class="nav-item">
                    <a href="manage-users.html" class="nav-link"><i class="fas fa-users"></i> Manage Users</a>
                </li>
                <li class="nav-item">
                    <a href="transactions.html" class="nav-link"><i class="fas fa-exchange-alt"></i> Transactions</a>
                </li>
                <li class="nav-item">
                    <a href="manage-fines.html" class="nav-link active"><i class="fas fa-money-bill-wave"></i> Manage
                        Fines</a>
                </li>
            </ul>
            <div style="margin-top: auto;">

                <button class="btn btn-danger" onclick="logout()" style="width: 100%;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div>
                    <h1>Manage Fines</h1>
                    <p class="text-muted">Review library penalties and collect payments</p>
                </div>
            </header>

            <div class="card fade-in-up stagger-1">
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Fine ID</th>
                                <th>User ID</th>
                                <th>Transaction ID</th>
                                <th>Amount</th>
                                <th>Reason</th>
                                <th>Date Incurred</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="finesTableBody">
                            <!-- Fines injected here -->
                        </tbody>
                    </table>
                </div>

                <div id="pagination"
                    style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem;">
                    <button class="btn btn-sm" id="prevBtn" onclick="prevPage()"><i class="fas fa-chevron-left"></i>
                        Prev</button>
                    <span id="pageInfo" style="font-weight: 500; font-size: 0.9rem;">Page 1 of 1</span>
                    <button class="btn btn-sm" id="nextBtn" onclick="nextPage()">Next <i
                            class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/animations.js"></script>
    <script>
        let currentPage = 0;
        const pageSize = 10;
        let totalPages = 1;

        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAdmin()) return;
            loadFines(0);
        });

        async function loadFines(page) {
            const tbody = document.getElementById('finesTableBody');
            if (tbody && typeof renderSkeletonTable === 'function') {
                renderSkeletonTable(tbody, 5, 8);
            }

            try {
                const res = await fetchApi(`/fines?page=${page}&size=${pageSize}`);
                if (res.success) {
                    const data = res.data;
                    currentPage = data.number || 0;
                    totalPages = data.totalPages || 1;
                    renderFines(data.content || []);
                    updatePagination();
                }
            } catch (err) {
                if (tbody) {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: var(--danger-color); padding: 2rem;">Failed to load fines.</td></tr>';
                }
                showToast('Failed to load fines: ' + (err.message || 'Unknown error'), 'error');
            }
        }

        function renderFines(fines) {
            const tbody = document.getElementById('finesTableBody');
            if (!tbody) return;
            tbody.innerHTML = '';

            if (fines.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8">
                            <div class="empty-state">
                                <i class="fas fa-money-bill-wave empty-state-icon"></i>
                                <h4>No fines recorded</h4>
                                <p>There are currently no overdue fines in the system.</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            fines.forEach(f => {
                const tr = document.createElement('tr');
                const isUnpaid = f.status === 'UNPAID';
                const badge = isUnpaid
                    ? '<span class="badge badge-danger"><i class="fas fa-exclamation-circle"></i> Unpaid</span>'
                    : '<span class="badge badge-success"><i class="fas fa-check-circle"></i> Paid</span>';

                const payBtn = isUnpaid
                    ? `<button class="btn btn-sm btn-primary" onclick="markFinePaid('${f.id}', this)"><i class="fas fa-check"></i> Collect Payment</button>`
                    : '<span class="text-muted" style="font-size: 0.85rem;"><i class="fas fa-check-double"></i> Settled</span>';

                tr.innerHTML = `
                    <td><code>${f.id ? f.id.substring(0, 8) : '-'}...</code></td>
                    <td><code>${f.userId ? f.userId.substring(0, 8) : '-'}...</code></td>
                    <td><code>${f.transactionId ? f.transactionId.substring(0, 8) : '-'}...</code></td>
                    <td style="font-weight: 700; color: ${isUnpaid ? 'var(--danger-color)' : 'var(--success-color)'};">₹ ${f.amount}</td>
                    <td>${f.reason || 'Late return'}</td>
                    <td>${f.createdAt ? new Date(f.createdAt).toLocaleDateString() : '-'}</td>
                    <td>${badge}</td>
                    <td>${payBtn}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function markFinePaid(fineId, btnElement) {
            if (confirm('Mark this fine as paid / collected?')) {
                try {
                    if (btnElement) {
                        btnElement.disabled = true;
                        btnElement.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
                    }
                    const res = await fetchApi(`/fines/${fineId}/pay`, {
                        method: 'POST'
                    });
                    if (res.success) {
                        showToast('Fine marked as paid!');
                        loadFines(currentPage);
                    }
                } catch (err) {
                    showToast(err.message, 'error');
                    if (btnElement) {
                        btnElement.disabled = false;
                        btnElement.innerHTML = '<i class="fas fa-check"></i> Collect Payment';
                    }
                }
            }
        }

        function updatePagination() {
            const pageInfo = document.getElementById('pageInfo');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            if (pageInfo) pageInfo.textContent = `Page ${currentPage + 1} of ${totalPages || 1}`;
            if (prevBtn) prevBtn.disabled = currentPage === 0;
            if (nextBtn) nextBtn.disabled = currentPage >= totalPages - 1;
        }

        function prevPage() {
            if (currentPage > 0) loadFines(currentPage - 1);
        }

        function nextPage() {
            if (currentPage < totalPages - 1) loadFines(currentPage + 1);
        }
    </script>
</body>

</html>
