<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Transactions - Library Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <i class="fas fa-book-open"></i> Library
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="admin-dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a href="manage-books.html" class="nav-link"><i class="fas fa-book"></i> Manage Books</a>
                </li>
                <li class="nav-item">
                    <a href="manage-users.html" class="nav-link"><i class="fas fa-users"></i> Manage Users</a>
                </li>
                <li class="nav-item">
                    <a href="transactions.html" class="nav-link active"><i class="fas fa-exchange-alt"></i>
                        Transactions</a>
                </li>
                <li class="nav-item">
                    <a href="manage-fines.html" class="nav-link"><i class="fas fa-money-bill-wave"></i> Manage Fines</a>
                </li>
            </ul>
            <div style="margin-top: auto;">

                <button class="btn btn-danger" onclick="logout()" style="width: 100%;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div>
                    <h1>Book Transactions</h1>
                    <p class="text-muted">Issue books to patrons and process returns smoothly</p>
                </div>
                <button class="btn btn-primary" onclick="openIssueModal()">
                    <i class="fas fa-plus"></i> Issue New Book
                </button>
            </header>

            <div class="card fade-in-up stagger-1">
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Transaction ID</th>
                                <th>User ID</th>
                                <th>Book ID</th>
                                <th>Issue Date</th>
                                <th>Due Date</th>
                                <th>Return Date</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="txTableBody">
                            <!-- Injected by JS -->
                        </tbody>
                    </table>
                </div>

                <div id="pagination"
                    style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem;">
                    <button class="btn btn-sm" id="prevBtn" onclick="prevPage()"><i class="fas fa-chevron-left"></i>
                        Prev</button>
                    <span id="pageInfo" style="font-weight: 500; font-size: 0.9rem;">Page 1 of 1</span>
                    <button class="btn btn-sm" id="nextBtn" onclick="nextPage()">Next <i
                            class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </main>
    </div>

    <!-- Issue Book Modal -->
    <div id="issueModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Issue Book to Patron</h2>
                <button class="close-btn" onclick="closeIssueModal()">&times;</button>
            </div>
            <form id="issueForm">
                <div class="form-group">
                    <label class="form-label" for="userId">User ID *</label>
                    <input type="text" id="userId" class="form-control" placeholder="Enter Patron User ID" required
                        autocomplete="off">
                </div>
                <div class="form-group">
                    <label class="form-label" for="bookId">Book ID *</label>
                    <input type="text" id="bookId" class="form-control" placeholder="Enter Book ID" required
                        autocomplete="off">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; padding: 0.85rem;">
                    <i class="fas fa-check"></i> Issue Book
                </button>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/animations.js"></script>
    <script>
        let currentPage = 0;
        const pageSize = 10;
        let totalPages = 1;
        let isSubmitting = false;

        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAdmin()) return;

            document.getElementById('issueForm').addEventListener('submit', handleIssueSubmit);
            loadTransactions(0);
        });

        async function loadTransactions(page) {
            const tbody = document.getElementById('txTableBody');
            if (tbody && typeof renderSkeletonTable === 'function') {
                renderSkeletonTable(tbody, 5, 8);
            }

            try {
                const res = await fetchApi(`/transactions?page=${page}&size=${pageSize}`);
                if (res.success) {
                    const data = res.data;
                    currentPage = data.number || 0;
                    totalPages = data.totalPages || 1;
                    renderTransactions(data.content || []);
                    updatePagination();
                }
            } catch (err) {
                if (tbody) {
                    tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: var(--danger-color); padding: 2rem;">Failed to load transactions.</td></tr>';
                }
                showToast('Failed to load transactions: ' + (err.message || 'Unknown error'), 'error');
            }
        }

        function renderTransactions(transactions) {
            const tbody = document.getElementById('txTableBody');
            if (!tbody) return;
            tbody.innerHTML = '';

            if (transactions.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8">
                            <div class="empty-state">
                                <i class="fas fa-exchange-alt empty-state-icon"></i>
                                <h4>No transactions recorded</h4>
                                <p>Newly issued book transactions will appear here.</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            transactions.forEach(t => {
                const tr = document.createElement('tr');
                tr.id = `tx-row-${t.id}`;

                let badge = '<span class="badge badge-success"><i class="fas fa-book-reader"></i> Issued</span>';
                if (t.status === 'OVERDUE') badge = '<span class="badge badge-danger"><i class="fas fa-exclamation-circle"></i> Overdue</span>';
                if (t.status === 'RETURNED') badge = '<span class="badge" style="background: rgba(108, 117, 125, 0.15); color: #6c757d;"><i class="fas fa-check-circle"></i> Returned</span>';

                const canReturn = t.status === 'ISSUED' || t.status === 'OVERDUE';
                const returnBtn = canReturn
                    ? `<button class="btn btn-sm btn-primary" onclick="returnBook('${t.id}', this)"><i class="fas fa-undo"></i> Return</button>`
                    : '<span class="text-muted" style="font-size: 0.85rem;"><i class="fas fa-check-double"></i> Completed</span>';

                tr.innerHTML = `
                    <td><code>${t.id ? t.id.substring(0, 8) : '-'}...</code></td>
                    <td><code>${t.userId ? t.userId.substring(0, 8) : '-'}...</code></td>
                    <td><code>${t.bookId ? t.bookId.substring(0, 8) : '-'}...</code></td>
                    <td>${t.issueDate ? new Date(t.issueDate).toLocaleDateString() : '-'}</td>
                    <td style="${t.status === 'OVERDUE' ? 'color: var(--danger-color); font-weight: 600;' : ''}">${t.dueDate ? new Date(t.dueDate).toLocaleDateString() : '-'}</td>
                    <td>${t.returnDate ? new Date(t.returnDate).toLocaleDateString() : '-'}</td>
                    <td>${badge}</td>
                    <td>${returnBtn}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function openIssueModal() {
            const modal = document.getElementById('issueModal');
            if (typeof openAnimatedModal === 'function') {
                openAnimatedModal(modal);
            } else {
                modal.style.display = 'flex';
            }
            document.getElementById('issueForm').reset();
        }

        function closeIssueModal() {
            const modal = document.getElementById('issueModal');
            if (typeof closeAnimatedModal === 'function') {
                closeAnimatedModal(modal);
            } else {
                modal.style.display = 'none';
            }
        }

        async function handleIssueSubmit(e) {
            e.preventDefault();
            if (isSubmitting) return;

            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalBtnHtml = submitBtn.innerHTML;

            const payload = {
                userId: document.getElementById('userId').value.trim(),
                bookId: document.getElementById('bookId').value.trim()
            };

            try {
                isSubmitting = true;
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Processing...';

                const res = await fetchApi('/transactions/issue', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                if (res.success) {
                    showToast('Book issued successfully!');
                    closeIssueModal();
                    loadTransactions(0);
                }
            } catch (err) {
                showToast(err.message, 'error');
                if (typeof shakeElement === 'function') shakeElement('issueForm');
            } finally {
                isSubmitting = false;
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalBtnHtml;
            }
        }

        async function returnBook(txId, btnElement) {
            if (confirm('Confirm return of this book?')) {
                try {
                    if (btnElement) {
                        btnElement.disabled = true;
                        btnElement.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
                    }
                    const res = await fetchApi(`/transactions/return/${txId}`, {
                        method: 'POST'
                    });
                    if (res.success) {
                        showToast('Book returned successfully!');
                        loadTransactions(currentPage);
                    }
                } catch (err) {
                    showToast(err.message, 'error');
                    if (btnElement) {
                        btnElement.disabled = false;
                        btnElement.innerHTML = '<i class="fas fa-undo"></i> Return';
                    }
                }
            }
        }

        function updatePagination() {
            const pageInfo = document.getElementById('pageInfo');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            if (pageInfo) pageInfo.textContent = `Page ${currentPage + 1} of ${totalPages || 1}`;
            if (prevBtn) prevBtn.disabled = currentPage === 0;
            if (nextBtn) nextBtn.disabled = currentPage >= totalPages - 1;
        }

        function prevPage() {
            if (currentPage > 0) loadTransactions(currentPage - 1);
        }

        function nextPage() {
            if (currentPage < totalPages - 1) loadTransactions(currentPage + 1);
        }
    </script>
</body>

</html>
