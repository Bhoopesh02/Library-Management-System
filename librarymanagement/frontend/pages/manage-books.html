<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Books - Library Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .sidebar-actions {
            display: flex;
            flex-direction: column;
            width: 100%;
        }
        @media (max-width: 768px) {
            .sidebar-actions {
                flex-direction: row !important;
                gap: 0.25rem;
                width: auto !important;
            }
            .sidebar-actions .btn {
                margin-bottom: 0 !important;
                width: 42px !important;
                height: 42px !important;
                padding: 0 !important;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 0 !important;
            }
            .sidebar-actions .btn i {
                font-size: 1.4rem;
                margin-right: 0;
            }
            .sidebar-actions .btn-primary {
                background-color: transparent !important;
                color: var(--text-muted) !important;
                box-shadow: none !important;
            }
            .sidebar-actions .btn-primary:hover {
                background-color: rgba(0, 180, 168, 0.1) !important;
                color: var(--primary-color) !important;
                transform: translateY(-2px);
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <i class="fas fa-book-open"></i> Library
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="admin-dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a href="manage-books.html" class="nav-link active"><i class="fas fa-book"></i> Manage Books</a>
                </li>
                <li class="nav-item">
                    <a href="manage-users.html" class="nav-link"><i class="fas fa-users"></i> Manage Users</a>
                </li>
                <li class="nav-item">
                    <a href="transactions.html" class="nav-link"><i class="fas fa-exchange-alt"></i> Transactions</a>
                </li>
                <li class="nav-item">
                    <a href="manage-fines.html" class="nav-link"><i class="fas fa-money-bill-wave"></i> Manage Fines</a>
                </li>
            </ul>
            <div class="sidebar-actions" style="margin-top: auto;">
                <button class="btn btn-danger" onclick="logout()" style="width: 100%;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div>
                    <h1>Manage Books</h1>
                    <p class="text-muted">Add, edit, and remove books from the library</p>
                </div>
                <button class="btn btn-primary" onclick="openBookModal()">
                    <i class="fas fa-plus"></i> Add New Book
                </button>
            </header>

            <div class="card fade-in-up stagger-1" style="margin-bottom: 1.5rem;">
                <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
                    <input type="text" id="searchInput" class="form-control"
                        placeholder="Search by Title, Author, or ISBN..." style="flex-grow: 1; min-width: 240px;">
                    <select id="categoryFilter" class="form-control" style="width: 240px;">
                        <!-- Options injected by categories.js -->
                    </select>
                    <button class="btn btn-primary" onclick="loadBooks(0)"><i class="fas fa-search"></i> Search</button>
                </div>

                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Title</th>
                                <th>Author</th>
                                <th>Category</th>
                                <th>ISBN</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="booksTableBody">
                            <!-- Books injected here -->
                        </tbody>
                    </table>
                </div>

                <div id="pagination"
                    style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem;">
                    <button class="btn btn-sm" id="prevBtn" onclick="prevPage()"><i class="fas fa-chevron-left"></i>
                        Prev</button>
                    <span id="pageInfo" style="font-weight: 500; font-size: 0.9rem;">Page 1 of 1</span>
                    <button class="btn btn-sm" id="nextBtn" onclick="nextPage()">Next <i
                            class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </main>
    </div>

    <!-- Add/Edit Book Modal -->
    <div id="bookModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">Add Book</h2>
                <button class="close-btn" onclick="closeBookModal()">&times;</button>
            </div>
            <form id="bookForm">
                <input type="hidden" id="bookId">
                <div class="form-group">
                    <label class="form-label" for="title">Title *</label>
                    <input type="text" id="title" class="form-control" placeholder="Enter book title" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="author">Author *</label>
                    <input type="text" id="author" class="form-control" placeholder="Enter author name" required>
                </div>
                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    <div class="form-group" style="flex: 1; min-width: 180px;">
                        <label class="form-label" for="isbn">ISBN *</label>
                        <input type="text" id="isbn" class="form-control" placeholder="e.g. 978-0132350884" required>
                    </div>
                    <div class="form-group" style="flex: 1; min-width: 180px;">
                        <label class="form-label" for="category">Category *</label>
                        <select id="category" class="form-control" required>
                            <!-- Options injected by JS -->
                        </select>
                    </div>
                </div>
                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    <div class="form-group" style="flex: 1; min-width: 180px;">
                        <label class="form-label" for="publisher">Publisher</label>
                        <input type="text" id="publisher" class="form-control" placeholder="Publisher name">
                    </div>
                    <div class="form-group" style="flex: 1; min-width: 180px;">
                        <label class="form-label" for="publicationYear">Year</label>
                        <input type="number" id="publicationYear" class="form-control" placeholder="e.g. 2024">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label" for="totalCopies">Total Copies *</label>
                    <input type="number" id="totalCopies" class="form-control" min="1" placeholder="Number of copies"
                        required>
                </div>
                <button type="submit" class="btn btn-primary"
                    style="width: 100%; padding: 0.85rem; font-size: 1rem; margin-top: 0.5rem;">
                    <i class="fas fa-save"></i> Save Book
                </button>
            </form>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/animations.js"></script>
    <script src="../js/categories.js"></script>
    <script src="../js/books.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('categoryFilter').innerHTML = generateCategoryOptions(true);
            document.getElementById('category').innerHTML = generateCategoryOptions(false);
        });
    </script>
</body>

</html>
