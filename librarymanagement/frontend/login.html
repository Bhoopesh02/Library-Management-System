<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Library Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-left fade-in">
                <h1>Welcome Back!</h1>
                <p style="margin-top: 1rem; opacity: 0.9; line-height: 1.6;">
                    Login to access your library account, manage books, track fines, and discover new reads in our modern Library Management System.
                </p>
                <div style="margin-top: 3rem;">
                    <i class="fas fa-book-reader fa-4x" style="opacity: 0.85;"></i>
                </div>
            </div>
            <div class="auth-right fade-in-up stagger-1">
                <h2 style="color: var(--primary-color); margin-bottom: 2rem; font-size: 2rem;">Login</h2>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label" for="email">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="Enter your email" required autocomplete="email">
                    </div>
                    
                    <div class="form-group" style="margin-bottom: 2rem;">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.1rem; padding: 0.9rem;">
                        <i class="fas fa-sign-in-alt"></i> Login
                    </button>
                </form>
                
                <p style="text-align: center; margin-top: 2rem; color: var(--text-muted);">
                    Don't have an account? <a href="register.html" style="font-weight: 600;">Register here</a>
                </p>
                
                <div style="text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
                    <a href="admin-login.html" style="color: var(--primary-color); font-weight: 500; display: inline-flex; align-items: center; gap: 0.5rem;">
                        <i class="fas fa-user-shield"></i> Administrator Portal
                    </a>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
