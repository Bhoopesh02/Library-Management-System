<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Library Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-left fade-in">
                <h1>Admin Portal</h1>
                <p style="margin-top: 1rem; opacity: 0.9; line-height: 1.6;">
                    Secure administrative access to manage the library catalog, users, transactions, and system settings.
                </p>
                <div style="margin-top: 3rem;">
                    <i class="fas fa-shield-alt fa-4x" style="opacity: 0.85;"></i>
                </div>
            </div>
            <div class="auth-right fade-in-up stagger-1">
                <h2 style="color: var(--primary-color); margin-bottom: 2rem; font-size: 2rem;">Admin Login</h2>
                
                <form id="adminLoginForm">
                    <div class="form-group">
                        <label class="form-label" for="email">Admin Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="admin@library.com" required autocomplete="email">
                    </div>
                    
                    <div class="form-group" style="margin-bottom: 2rem;">
                        <label class="form-label" for="password">Password</label>
                        <div style="position: relative;">
                            <input type="password" id="password" class="form-control" placeholder="Enter admin password" required autocomplete="current-password">
                            <i class="fas fa-eye" id="togglePassword" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted); transition: color 0.2s ease;"></i>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn btn-primary" style="width: 100%; font-size: 1.1rem; padding: 0.9rem;">
                        <i class="fas fa-sign-in-alt"></i> Login as Admin
                    </button>
                </form>
                
                <div style="text-align: center; margin-top: 2rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color);">
                    <a href="login.html" style="color: var(--text-muted); font-weight: 500; display: inline-flex; align-items: center; gap: 0.5rem;">
                        <i class="fas fa-arrow-left"></i> Back to User Login
                    </a>
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/api.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
