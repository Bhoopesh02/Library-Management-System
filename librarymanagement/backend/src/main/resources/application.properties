server.port=${PORT:8080}

# MongoDB Configuration
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/library_management}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
# Note: For production, this should be provided via environment variables.
# Using a static secret here for development purposes.
app.jwt.secret=${JWT_SECRET:94a08da1fecbb6e8b46990538c7b50b294a08da1fecbb6e8b46990538c7b50b2}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

# Fines Configuration
app.fine.per-day=5

# Logging
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# Multipart File Upload Config
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
