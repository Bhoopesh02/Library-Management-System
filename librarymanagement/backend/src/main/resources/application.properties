server.port=${PORT:8080}

# MongoDB Configuration
spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/library_management}
spring.data.mongodb.database=${MONGO_DATABASE:library_management}
spring.data.mongodb.auto-index-creation=true

# JWT Configuration
# Note: For production, this should be provided via environment variables.
# Using a static secret here for development purposes.
app.jwt.secret=${JWT_SECRET:94a08da1fecbb6e8b46990538c7b50b294a08da1fecbb6e8b46990538c7b50b2}
app.jwt.expiration-ms=${JWT_EXPIRATION:900000}

# Fines Configuration
app.fine.per-day=5

# Mail & OTP Configuration (Brevo SMTP)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${BREVO_SMTP_USERNAME:}
spring.mail.password=${BREVO_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:admin@library.com}
app.otp.expiration-minutes=${OTP_EXPIRATION_MINUTES:5}

# Logging
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG

# Multipart File Upload Config
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Admin Registration & Security Configuration
app.admin.secret-key=${ADMIN_REGISTRATION_SECRET:}
app.admin.master-key=${ADMIN_MASTER_KEY:}
app.admin.registration-enabled=${ADMIN_REGISTRATION_ENABLED:true}
app.admin.trust-proxy-headers=${ADMIN_TRUST_PROXY_HEADERS:false}

# CORS Configuration
app.cors.frontend-url=${FRONTEND_URL:http://localhost:5173}
