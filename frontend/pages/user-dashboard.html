<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Dashboard - Library Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <i class="fas fa-book-open"></i> Library
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="user-dashboard.html" class="nav-link active"><i class="fas fa-home"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a href="books.html" class="nav-link"><i class="fas fa-search"></i> Browse Books</a>
                </li>
                <li class="nav-item">
                    <a href="my-books.html" class="nav-link"><i class="fas fa-book-reader"></i> My Books</a>
                </li>
                <li class="nav-item">
                    <a href="fines.html" class="nav-link"><i class="fas fa-money-bill-wave"></i> My Fines</a>
                </li>
            </ul>
            <div style="margin-top: auto;">

                <button class="btn btn-danger" onclick="logout()" style="width: 100%;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div>
                    <h1>Welcome, <span id="userNameHeader">Reader</span>!</h1>
                    <p class="text-muted">Here is the overview of your library account</p>
                </div>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <div
                        style="width: 40px; height: 40px; border-radius: 50%; background-color: var(--primary-color); color: white; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(0,180,168,0.3);">
                        <i class="fas fa-user-graduate"></i>
                    </div>
                </div>
            </header>

            <!-- Stats Grid -->
            <div class="stats-grid">
                <div class="stat-card fade-in-up stagger-1">
                    <div class="stat-icon"
                        style="background-color: rgba(0, 180, 168, 0.1); color: var(--primary-color);"><i
                            class="fas fa-book-reader"></i></div>
                    <div class="stat-details">
                        <h3 id="statBorrowed">0</h3>
                        <p>Currently Borrowed</p>
                    </div>
                </div>
                <div class="stat-card fade-in-up stagger-2">
                    <div class="stat-icon"
                        style="background-color: rgba(255, 193, 7, 0.1); color: var(--warning-color);"><i
                            class="fas fa-clock"></i></div>
                    <div class="stat-details">
                        <h3 id="statDueSoon">0</h3>
                        <p>Due Soon</p>
                    </div>
                </div>
                <div class="stat-card fade-in-up stagger-3">
                    <div class="stat-icon"
                        style="background-color: rgba(255, 76, 76, 0.1); color: var(--danger-color);"><i
                            class="fas fa-exclamation-triangle"></i></div>
                    <div class="stat-details">
                        <h3 id="statPendingFines">₹ 0</h3>
                        <p>Pending Fines</p>
                    </div>
                </div>
            </div>

            <div class="card fade-in-up stagger-4" style="margin-bottom: 2rem;">
                <h3 style="margin-bottom: 1rem;">My Current Books</h3>
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Book Title</th>
                                <th>Issue Date</th>
                                <th>Due Date</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="myBooksTable">
                            <!-- Injected by JS with skeleton initial state -->
                        </tbody>
                    </table>
                </div>
            </div>

        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/animations.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user'));

            if (!token || !user) {
                window.location.href = '../login.html';
                return;
            }

            if (user.name) {
                document.getElementById('userNameHeader').textContent = user.name.split(' ')[0];
            }

            const myBooksTable = document.getElementById('myBooksTable');
            renderSkeletonTable(myBooksTable, 3, 4);

            try {
                // Fetch user transactions
                const response = await fetchApi(`/transactions/user/${user.id}`);
                if (response.success) {
                    const transactions = response.data.content || [];

                    let currentlyBorrowed = 0;
                    let dueSoon = 0;
                    const today = new Date();
                    const nextWeek = new Date();
                    nextWeek.setDate(today.getDate() + 7);

                    const activeTransactions = transactions.filter(t => t.status === 'ISSUED' || t.status === 'OVERDUE');
                    myBooksTable.innerHTML = '';

                    if (activeTransactions.length === 0) {
                        myBooksTable.innerHTML = `
                            <tr>
                                <td colspan="4">
                                    <div class="empty-state">
                                        <i class="fas fa-book-open empty-state-icon"></i>
                                        <h4>No currently borrowed books</h4>
                                        <p>Browse the catalog and borrow books to start reading.</p>
                                    </div>
                                </td>
                            </tr>
                        `;
                    } else {
                        for (const t of activeTransactions) {
                            currentlyBorrowed++;

                            const dueDate = new Date(t.dueDate);
                            if (dueDate <= nextWeek && dueDate >= today) {
                                dueSoon++;
                            }

                            let title = 'Book ID: ' + (t.bookId ? t.bookId.substring(0, 8) : '-') + '...';

                            const tr = document.createElement('tr');
                            let statusBadge = t.status === 'OVERDUE'
                                ? '<span class="badge badge-danger"><i class="fas fa-exclamation-circle"></i> Overdue</span>'
                                : '<span class="badge badge-success"><i class="fas fa-check-circle"></i> Issued</span>';

                            tr.innerHTML = `
                                <td><i class="fas fa-book" style="margin-right: 8px; color: var(--primary-color)"></i> ${title}</td>
                                <td>${t.issueDate ? new Date(t.issueDate).toLocaleDateString() : '-'}</td>
                                <td style="${t.status === 'OVERDUE' ? 'color: var(--danger-color); font-weight: 600;' : ''}">${dueDate.toLocaleDateString()}</td>
                                <td>${statusBadge}</td>
                            `;
                            myBooksTable.appendChild(tr);
                        }
                    }

                    animateCountUp('statBorrowed', currentlyBorrowed, 500);
                    animateCountUp('statDueSoon', dueSoon, 500);
                }

                // Fetch user fines
                const fineResponse = await fetchApi(`/fines/user/${user.id}`);
                if (fineResponse.success) {
                    const fines = fineResponse.data.content || [];
                    const pendingAmount = fines
                        .filter(f => f.status === 'UNPAID')
                        .reduce((sum, f) => sum + f.amount, 0);

                    animateCountUp('statPendingFines', pendingAmount, 500, '₹ ');
                }
            } catch (error) {
                console.error("Error loading user dashboard", error);
                myBooksTable.innerHTML = '<tr><td colspan="4" style="text-align: center; color: var(--danger-color); padding: 1.5rem;">Failed to load account data.</td></tr>';
            }
        });
    </script>
</body>

</html>
