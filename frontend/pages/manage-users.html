<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Users - Library Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <i class="fas fa-book-open"></i> Library
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="admin-dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a href="manage-books.html" class="nav-link"><i class="fas fa-book"></i> Manage Books</a>
                </li>
                <li class="nav-item">
                    <a href="manage-users.html" class="nav-link active"><i class="fas fa-users"></i> Manage Users</a>
                </li>
                <li class="nav-item">
                    <a href="transactions.html" class="nav-link"><i class="fas fa-exchange-alt"></i> Transactions</a>
                </li>
                <li class="nav-item">
                    <a href="manage-fines.html" class="nav-link"><i class="fas fa-money-bill-wave"></i> Manage Fines</a>
                </li>
            </ul>
            <div style="margin-top: auto;">

                <button class="btn btn-danger" onclick="logout()" style="width: 100%;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div>
                    <h1>Manage Users</h1>
                    <p class="text-muted">View registered patrons, administrators, and manage account statuses</p>
                </div>
            </header>

            <div class="card fade-in-up stagger-1">
                <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
                    <input type="text" id="searchInput" class="form-control"
                        placeholder="Search users by Name or Email..." style="flex-grow: 1;">
                    <button class="btn btn-primary" onclick="loadUsers(0)"><i class="fas fa-search"></i> Search</button>
                </div>

                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Phone</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <!-- Users injected here -->
                        </tbody>
                    </table>
                </div>

                <div id="pagination"
                    style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem;">
                    <button class="btn btn-sm" id="prevBtn" onclick="prevPage()"><i class="fas fa-chevron-left"></i>
                        Prev</button>
                    <span id="pageInfo" style="font-weight: 500; font-size: 0.9rem;">Page 1 of 1</span>
                    <button class="btn btn-sm" id="nextBtn" onclick="nextPage()">Next <i
                            class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/animations.js"></script>
    <script>
        let currentPage = 0;
        const pageSize = 10;
        let totalPages = 1;

        document.addEventListener('DOMContentLoaded', () => {
            if (!requireAdmin()) return;

            const searchInput = document.getElementById('searchInput');
            if (searchInput && typeof debounce === 'function') {
                searchInput.addEventListener('input', debounce(() => {
                    loadUsers(0);
                }, 300));
            }

            loadUsers(0);
        });

        async function loadUsers(page) {
            const tbody = document.getElementById('usersTableBody');
            if (tbody && typeof renderSkeletonTable === 'function') {
                renderSkeletonTable(tbody, 5, 6);
            }

            const search = document.getElementById('searchInput').value.trim();
            const url = `/users?page=${page}&size=${pageSize}${search ? '&search=' + encodeURIComponent(search) : ''}`;

            try {
                const res = await fetchApi(url);
                if (res.success) {
                    const data = res.data;
                    currentPage = data.number || 0;
                    totalPages = data.totalPages || 1;
                    renderUsers(data.content || []);
                    updatePagination();
                }
            } catch (err) {
                if (tbody) {
                    tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--danger-color); padding: 2rem;">Failed to load users.</td></tr>';
                }
                showToast('Failed to load users: ' + (err.message || 'Unknown error'), 'error');
            }
        }

        function renderUsers(users) {
            const tbody = document.getElementById('usersTableBody');
            if (!tbody) return;
            tbody.innerHTML = '';

            if (users.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="6">
                            <div class="empty-state">
                                <i class="fas fa-users empty-state-icon"></i>
                                <h4>No users found</h4>
                                <p>No patrons or admin records matched your search.</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            users.forEach(u => {
                const tr = document.createElement('tr');
                const roleBadge = u.role === 'ADMIN'
                    ? '<span class="badge" style="background: rgba(114, 9, 183, 0.12); color: #7209b7;"><i class="fas fa-shield-alt"></i> Admin</span>'
                    : '<span class="badge" style="background: rgba(0, 180, 168, 0.12); color: var(--primary-color);"><i class="fas fa-user-graduate"></i> Member</span>';

                const statusBadge = u.status === 'ACTIVE'
                    ? '<span class="badge badge-success"><i class="fas fa-check-circle"></i> Active</span>'
                    : '<span class="badge badge-danger"><i class="fas fa-ban"></i> Suspended</span>';

                const toggleAction = u.status === 'ACTIVE'
                    ? `<button class="btn btn-sm btn-danger" onclick="toggleUserStatus('${u.id}', 'SUSPENDED', this)"><i class="fas fa-ban"></i> Suspend</button>`
                    : `<button class="btn btn-sm btn-primary" onclick="toggleUserStatus('${u.id}', 'ACTIVE', this)"><i class="fas fa-check"></i> Activate</button>`;

                tr.innerHTML = `
                    <td style="font-weight: 500;"><i class="fas fa-user-circle" style="margin-right: 8px; color: var(--text-muted); font-size: 1.1rem;"></i> ${u.name}</td>
                    <td>${u.email}</td>
                    <td>${roleBadge}</td>
                    <td>${u.phoneNumber || '-'}</td>
                    <td>${statusBadge}</td>
                    <td>${u.role === 'ADMIN' ? '<span class="text-muted" style="font-size:0.85rem;"><i class="fas fa-lock"></i> Protected</span>' : toggleAction}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        async function toggleUserStatus(userId, newStatus, btnElement) {
            try {
                if (btnElement) {
                    btnElement.disabled = true;
                    btnElement.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i>';
                }
                const res = await fetchApi(`/users/${userId}/status?status=${newStatus}`, {
                    method: 'PUT'
                });
                if (res.success) {
                    showToast(`User status updated to ${newStatus}`);
                    loadUsers(currentPage);
                }
            } catch (err) {
                showToast(err.message, 'error');
                if (btnElement) {
                    btnElement.disabled = false;
                    btnElement.innerHTML = newStatus === 'ACTIVE' ? '<i class="fas fa-check"></i> Activate' : '<i class="fas fa-ban"></i> Suspend';
                }
            }
        }

        function updatePagination() {
            const pageInfo = document.getElementById('pageInfo');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            if (pageInfo) pageInfo.textContent = `Page ${currentPage + 1} of ${totalPages || 1}`;
            if (prevBtn) prevBtn.disabled = currentPage === 0;
            if (nextBtn) nextBtn.disabled = currentPage >= totalPages - 1;
        }

        function prevPage() {
            if (currentPage > 0) loadUsers(currentPage - 1);
        }

        function nextPage() {
            if (currentPage < totalPages - 1) loadUsers(currentPage + 1);
        }
    </script>
</body>

</html>
