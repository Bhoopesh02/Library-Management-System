<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Books - Library Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-logo">
                <i class="fas fa-book-open"></i> Library
            </div>
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="user-dashboard.html" class="nav-link"><i class="fas fa-home"></i> Dashboard</a>
                </li>
                <li class="nav-item">
                    <a href="books.html" class="nav-link"><i class="fas fa-search"></i> Browse Books</a>
                </li>
                <li class="nav-item">
                    <a href="my-books.html" class="nav-link active"><i class="fas fa-book-reader"></i> My Books</a>
                </li>
                <li class="nav-item">
                    <a href="fines.html" class="nav-link"><i class="fas fa-money-bill-wave"></i> My Fines</a>
                </li>
            </ul>
            <div style="margin-top: auto;">

                <button class="btn btn-danger" onclick="logout()" style="width: 100%;">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div>
                    <h1>My Books & History</h1>
                    <p class="text-muted">Track your currently issued books and loan history</p>
                </div>
            </header>

            <!-- Tabs/Filter -->
            <div style="display: flex; gap: 10px; margin-bottom: 1.5rem;" class="fade-in-up stagger-1">
                <button class="btn btn-primary" id="filterActiveBtn" onclick="filterTransactions('ACTIVE')">
                    <i class="fas fa-book-reader"></i> Currently Borrowed
                </button>
                <button class="btn" id="filterAllBtn" onclick="filterTransactions('ALL')"
                    style="background-color: var(--card-bg); color: var(--text-main); border: 1px solid var(--border-color);">
                    <i class="fas fa-history"></i> All History
                </button>
            </div>

            <div class="card fade-in-up stagger-2">
                <div class="table-container">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Book Details</th>
                                <th>Issue Date</th>
                                <th>Due Date</th>
                                <th>Return Date</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="transactionsTableBody">
                            <!-- Injected by JS -->
                        </tbody>
                    </table>
                </div>

                <div id="pagination"
                    style="display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem;">
                    <button class="btn btn-sm" id="prevBtn" onclick="prevPage()"><i class="fas fa-chevron-left"></i>
                        Prev</button>
                    <span id="pageInfo" style="font-weight: 500; font-size: 0.9rem;">Page 1 of 1</span>
                    <button class="btn btn-sm" id="nextBtn" onclick="nextPage()">Next <i
                            class="fas fa-chevron-right"></i></button>
                </div>
            </div>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/animations.js"></script>
    <script>
        let currentFilter = 'ACTIVE';
        let currentPage = 0;
        const pageSize = 10;
        let totalPages = 1;
        let allTransactions = [];
        let bookCache = {};

        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            const user = JSON.parse(localStorage.getItem('user'));
            if (!token || !user) {
                window.location.href = '../login.html';
                return;
            }
            loadUserTransactions(0);
        });

        function filterTransactions(filter) {
            currentFilter = filter;
            const activeBtn = document.getElementById('filterActiveBtn');
            const allBtn = document.getElementById('filterAllBtn');

            if (filter === 'ACTIVE') {
                activeBtn.className = 'btn btn-primary';
                activeBtn.style.background = '';
                activeBtn.style.color = '#fff';
                activeBtn.style.border = 'none';

                allBtn.className = 'btn';
                allBtn.style.background = 'var(--card-bg)';
                allBtn.style.color = 'var(--text-main)';
                allBtn.style.border = '1px solid var(--border-color)';
            } else {
                allBtn.className = 'btn btn-primary';
                allBtn.style.background = '';
                allBtn.style.color = '#fff';
                allBtn.style.border = 'none';

                activeBtn.className = 'btn';
                activeBtn.style.background = 'var(--card-bg)';
                activeBtn.style.color = 'var(--text-main)';
                activeBtn.style.border = '1px solid var(--border-color)';
            }

            renderTable();
        }

        async function getBookTitle(bookId) {
            if (!bookId) return 'Unknown Book';
            if (bookCache[bookId]) return bookCache[bookId];
            try {
                const res = await fetchApi(`/books/${bookId}`);
                if (res.success && res.data) {
                    bookCache[bookId] = `${res.data.title} (${res.data.author})`;
                    return bookCache[bookId];
                }
            } catch (e) {
                // Ignore fallback to book ID
            }
            return `Book ID: ${bookId.substring(0, 8)}...`;
        }

        async function loadUserTransactions(page) {
            const user = JSON.parse(localStorage.getItem('user'));
            const tbody = document.getElementById('transactionsTableBody');
            if (tbody && typeof renderSkeletonTable === 'function') {
                renderSkeletonTable(tbody, 4, 5);
            }

            try {
                const response = await fetchApi(`/transactions/user/${user.id}?page=${page}&size=${pageSize}`);
                if (response.success) {
                    allTransactions = response.data.content || [];
                    currentPage = response.data.number || 0;
                    totalPages = response.data.totalPages || 1;
                    await renderTable();
                    updatePagination();
                }
            } catch (error) {
                if (tbody) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: var(--danger-color); padding: 2rem;">Failed to load transactions.</td></tr>';
                }
                showToast('Failed to load transaction history: ' + (error.message || 'Unknown error'), 'error');
            }
        }

        async function renderTable() {
            const tbody = document.getElementById('transactionsTableBody');
            if (!tbody) return;
            tbody.innerHTML = '';

            let list = allTransactions;
            if (currentFilter === 'ACTIVE') {
                list = list.filter(t => t.status === 'ISSUED' || t.status === 'OVERDUE');
            }

            if (list.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5">
                            <div class="empty-state">
                                <i class="fas fa-book-reader empty-state-icon"></i>
                                <h4>No ${currentFilter === 'ACTIVE' ? 'currently borrowed' : ''} books</h4>
                                <p>${currentFilter === 'ACTIVE' ? 'You have no books currently checked out. Browse the catalog to find books.' : 'No book transaction history found.'}</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            for (const t of list) {
                const tr = document.createElement('tr');
                const title = await getBookTitle(t.bookId);

                let badge = '<span class="badge badge-success"><i class="fas fa-book-reader"></i> Issued</span>';
                if (t.status === 'OVERDUE') badge = '<span class="badge badge-danger"><i class="fas fa-exclamation-circle"></i> Overdue</span>';
                if (t.status === 'RETURNED') badge = '<span class="badge" style="background: rgba(108, 117, 125, 0.15); color: #6c757d;"><i class="fas fa-check-circle"></i> Returned</span>';

                tr.innerHTML = `
                    <td style="font-weight: 600;"><i class="fas fa-book" style="color: var(--primary-color); margin-right: 8px;"></i> ${title}</td>
                    <td>${t.issueDate ? new Date(t.issueDate).toLocaleDateString() : '-'}</td>
                    <td style="${t.status === 'OVERDUE' ? 'color: var(--danger-color); font-weight: 600;' : ''}">${t.dueDate ? new Date(t.dueDate).toLocaleDateString() : '-'}</td>
                    <td>${t.returnDate ? new Date(t.returnDate).toLocaleDateString() : '-'}</td>
                    <td>${badge}</td>
                `;
                tbody.appendChild(tr);
            }
        }

        function updatePagination() {
            const pageInfo = document.getElementById('pageInfo');
            const prevBtn = document.getElementById('prevBtn');
            const nextBtn = document.getElementById('nextBtn');

            if (pageInfo) pageInfo.textContent = `Page ${currentPage + 1} of ${totalPages || 1}`;
            if (prevBtn) prevBtn.disabled = currentPage === 0;
            if (nextBtn) nextBtn.disabled = currentPage >= totalPages - 1;
        }

        function prevPage() {
            if (currentPage > 0) loadUserTransactions(currentPage - 1);
        }

        function nextPage() {
            if (currentPage < totalPages - 1) loadUserTransactions(currentPage + 1);
        }
    </script>
</body>

</html>
